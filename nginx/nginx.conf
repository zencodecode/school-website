worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # =========================================
    # Basic Settings
    # =========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;  # Max upload size untuk media

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================
    # Logging
    # =========================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # =========================================
    # Gzip Compression
    # =========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # =========================================
    # Rate Limiting (optional, basic protection)
    # =========================================
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # =========================================
    # Upstream — Next.js App
    # =========================================
    upstream nextjs_app {
        server app:3000;
    }

    # =========================================
    # Server Block
    # =========================================
    server {
        listen 80;
        server_name ponpesabubakarsidik.com www.ponpesabubakarsidik.com;

        # -----------------------------------------
        # Security Headers
        # -----------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -----------------------------------------
        # Redirect www ke non-www
        # -----------------------------------------
        if ($host = www.ponpesabubakarsidik.com) {
            return 301 $scheme://ponpesabubakarsidik.com$request_uri;
        }

        # -----------------------------------------
        # Static files caching
        # -----------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # -----------------------------------------
        # Media files
        # -----------------------------------------
        location /media/ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # -----------------------------------------
        # Next.js Image Optimization
        # -----------------------------------------
        location /_next/image {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 60d;
            add_header Cache-Control "public, max-age=5184000";
        }

        # -----------------------------------------
        # Admin panel — no caching
        # -----------------------------------------
        location /admin {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # -----------------------------------------
        # API routes — no caching
        # -----------------------------------------
        location /api/ {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------
        # All other requests — Next.js app
        # -----------------------------------------
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
